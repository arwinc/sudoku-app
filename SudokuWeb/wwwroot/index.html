<!DOCTYPE html>

<html>

<head>
  <title>SudokuWeb</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body, pre {
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Geist Mono', monospace;
    }

    #out {
      white-space: pre-wrap;
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    #loading {
      color: #808080;
      font-style: italic;
      margin-bottom: 8px;
    }

    #input-row {
      display: none;
      gap: 8px;
    }

    #prompt {
      color: #4ec9b0;
    }

    #cmd {
      background: transparent;
      border-bottom: 1px solid #555;
      border: none;
      color: #fff;
      flex: 1;
      font-family: 'Geist Mono', monospace;
      font-size: 16px;
      outline: none;
    }

    #restart-btn {
      margin-top: 8px;
      padding: 8px 14px;
      border: 1px solid #555;
      background: #2d2d2d;
      color: #4ec9b0;
      cursor: pointer;
      font-family: 'Geist Mono', monospace;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <pre id="out">Initializing...</pre>

  <div id="loading" style="display: none;">
    Loading...
  </div>
  <div id="input-row" style="display: none;">
    <span id="prompt">&gt;</span>
    <input id="cmd" type="text" placeholder="Type input and press Enter..." />
  </div>
  <button id="restart-btn" onclick="location.reload()" style="display:none;">
    &#x21bb; Restart Program
  </button>
  <script type='module' src="main#[.{fingerprint}].js"></script>
</body>

</html>
