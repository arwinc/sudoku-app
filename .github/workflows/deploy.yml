name: Build, Test, and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Sudoku.slnx

      - name: Run unit tests
        run: dotnet test SudokuApp.Tests/SudokuApp.Tests.csproj -c Release --no-restore

      - name: Publish SudokuWeb Wasm
        run: dotnet publish SudokuWeb/SudokuWeb.csproj -c Release -o release

      - name: Add .nojekyll for GitHub Pages
        run: touch release/wwwroot/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
